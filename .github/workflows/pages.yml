name: 公開

# 画面と一式を、このリポジトリからそのまま公開する。
# main に入った内容が、そのまま配布物になる。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 一式を組み立て、照合用の値を index.html へ埋める。
      # 人が値を書き写さないので、画面と配る中身が食い違わない。
      - name: 一式を作る
        run: bash scripts/build-kit.sh

      - name: 公開するものをまとめる
        run: |
          mkdir -p _site/kit
          cp index.html _site/index.html
          cp dist/shitaku-kit.tar.gz _site/kit/shitaku-kit.tar.gz

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
