<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初期ヒアリング</title>
<!-- 外部への依存を持たない。ネットが制限されたパソコンでもそのまま開ける。 -->
<style>
  :root{
    --ground:#FFFFFF;
    --surface:#F5F6F4;
    --ink:#0F1417;
    --ink-2:#59636A;
    --ink-3:#8E979D;
    --line:#E3E6E2;
    --line-strong:#C9CFC9;
    --accent:#0D5C55;
    --accent-hover:#0A4A45;
    --accent-soft:#E7F0EE;
    --stop:#A63A2E;
    --focus:#0D5C55;
    --radius:10px;
    --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0E1113;
      --surface:#171B1E;
      --ink:#ECEFED;
      --ink-2:#A2ABB0;
      --ink-3:#79838A;
      --line:#262C30;
      --line-strong:#39434A;
      --accent:#5FBFB0;
      --accent-hover:#7ACFC1;
      --accent-soft:#13302D;
      --stop:#E08272;
      --focus:#5FBFB0;
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--jp);
    font-size:17px;
    line-height:1.9;
    letter-spacing:.01em;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,p,label,.note,.lede,.kicker{
    word-break:auto-phrase;
    overflow-wrap:anywhere;
  }
  h1,h2{text-wrap:balance}
  p,.lede{text-wrap:pretty}

  .page{
    max-width:680px;
    margin:0 auto;
    padding:clamp(48px,9vw,104px) clamp(20px,5vw,32px) 120px;
  }

  /* ---------- header ---------- */
  .masthead{margin-bottom:clamp(44px,7vw,72px)}
  .kicker{
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-3);
    margin:0 0 18px;
  }
  h1{
    margin:0;
    font-size:clamp(30px,5.2vw,42px);
    line-height:1.3;
    font-weight:700;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .masthead p{
    margin:18px 0 0;
    color:var(--ink-2);
    font-size:16px;
    max-width:30em;
  }

  /* ---------- steps ---------- */
  .step{
    display:grid;
    grid-template-columns:36px 1fr;
    column-gap:20px;
    padding-bottom:clamp(40px,6vw,56px);
  }
  .step + .step{
    border-top:1px solid var(--line);
    padding-top:clamp(40px,6vw,56px);
  }
  .marker{
    width:36px;height:36px;
    border-radius:50%;
    border:1.5px solid var(--line-strong);
    color:var(--ink-3);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;
    font-variant-numeric:tabular-nums;
    margin-top:2px;
    transition:border-color .2s,color .2s,background .2s;
  }
  .step[data-state="active"] .marker{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--ground);
  }
  @media (prefers-color-scheme: dark){
    .step[data-state="active"] .marker{color:#0B1B19}
  }
  .step h2{
    margin:4px 0 0;
    font-size:20px;
    line-height:1.6;
    font-weight:700;
    letter-spacing:-.005em;
  }
  .step .body{min-width:0}
  .step[data-state="waiting"] .body > *:not(h2){opacity:.4}
  .step[data-state="waiting"] .body{pointer-events:none}
  .lede{margin:10px 0 0;color:var(--ink-2);font-size:15.5px}

  /* ---------- input ---------- */
  .field{margin-top:22px}
  label{
    display:block;
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--ink-2);
    margin-bottom:10px;
  }
  textarea{
    display:block;
    width:100%;
    min-height:190px;
    padding:20px 22px;
    font-family:inherit;
    font-size:17px;
    line-height:1.9;
    color:var(--ink);
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    resize:vertical;
    transition:border-color .15s,background .15s;
  }
  textarea::placeholder{color:var(--ink-3);opacity:1}
  textarea:hover{border-color:var(--line-strong)}
  textarea:focus{outline:none;border-color:var(--accent);background:var(--ground)}
  textarea:focus-visible{box-shadow:0 0 0 4px var(--accent-soft)}

  .examples{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
  .examples .cap{font-size:13px;color:var(--ink-3)}
  .chip{
    font-family:inherit;
    font-size:14px;
    color:var(--ink-2);
    background:transparent;
    border:1.5px solid var(--line-strong);
    border-radius:999px;
    padding:9px 16px;
    min-height:40px;
    cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;
  }
  .chip:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  .alert{
    display:none;
    margin-top:16px;
    padding:12px 16px;
    border-left:3px solid var(--stop);
    background:var(--surface);
    color:var(--stop);
    font-size:15px;
    font-weight:700;
    border-radius:0 6px 6px 0;
  }
  .alert.on{display:block}

  /* ---------- actions ---------- */
  .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
  .btn{
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    min-height:52px;
    padding:0 32px;
    border-radius:var(--radius);
    border:1.5px solid var(--accent);
    background:var(--accent);
    color:var(--ground);
    cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
  }
  @media (prefers-color-scheme: dark){ .btn{color:#0B1B19} }
  .btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
  .btn.quiet{
    background:transparent;
    color:var(--ink-2);
    border-color:var(--line-strong);
    font-weight:500;
  }
  .btn.quiet:hover{color:var(--ink);border-color:var(--ink-2);background:transparent}
  :focus-visible{outline:2.5px solid var(--focus);outline-offset:3px}
  .note{font-size:13.5px;color:var(--ink-3)}

  /* ---------- paste box ---------- */
  .paste{
    margin-top:20px;
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    font-family:var(--mono);
    font-size:14.5px;
    line-height:2;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .step[data-state="active"] .paste{border-color:var(--accent);background:var(--accent-soft)}

  @media (max-width:520px){
    .step{grid-template-columns:1fr;row-gap:14px}
    .marker{margin-bottom:2px}
    .btn{width:100%}
    .actions{gap:10px}
  }
</style>
</head>
<body>
<main class="page">

  <header class="masthead">
    <p class="kicker">STEP 1 / 2</p>
    <h1>初期ヒアリング</h1>
    <p>作りたいことを書くと、AIに渡す指示書ができます。</p>
  </header>

  <section class="step" id="step1" data-state="active">
    <div class="marker">1</div>
    <div class="body">
      <h2>作りたいことを書く</h2>
      <p class="lede">誰が使って、その人の何が良くなるとうれしいか。それだけで足ります。<br>減らしたいこと、増やしたいこと、まだ無いもの。どれでもかまいません。</p>

      <div class="field">
        <label for="wish">作りたいもの</label>
        <textarea id="wish" aria-describedby="err"
          placeholder="例）うちの美容室の予約を、電話じゃなくてネットで受けたい。&#10;今は営業中に電話が鳴って、そのたびに手が止まる。"></textarea>
      </div>

      <div class="examples">
        <span class="cap">例を入れる</span>
        <button class="chip" type="button" data-fill="うちの美容室の予約を、電話じゃなくてネットで受けたい。今は営業中に電話が鳴って手が止まる。">手間を減らしたい</button>
        <button class="chip" type="button" data-fill="作った器の写真を並べて、気に入った人がそのまま問い合わせできるページがほしい。今は見てもらう場所が無い。">見てもらいたい</button>
        <button class="chip" type="button" data-fill="シフト表を作るときに、人数が足りない日を自動で赤く出したい。今は目で数えていて、たまに見落とす。">間違いを無くしたい</button>
      </div>

      <p id="err" class="alert" role="alert">何を作りたいか、数行書いてください。</p>

      <div class="actions">
        <button class="btn" id="go" type="button">確定</button>
        <span class="note">押すと、指示書が1枚ダウンロードされます</span>
      </div>
    </div>
  </section>

  <section class="step" id="step2" data-state="waiting">
    <div class="marker">2</div>
    <div class="body">
      <h2>AIのチャット欄に貼り付けてください</h2>
      <p class="lede">下の文をコピーして、お使いのAIにそのまま貼り付けます。</p>

      <div class="paste" id="say">新しい空のフォルダを作って、そこで作業してください。いま落とした「shitaku.md」を読んで、書いてあるとおりに進めてください。</div>

      <div class="actions">
        <button class="btn" id="copy" type="button">コピー</button>
        <button class="btn quiet" id="again" type="button">やり直す</button>
      </div>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var KIT_URL = 'https://rahiseko-alt.github.io/test-t-826-/kit/shitaku-kit.tar.gz';
  var KIT_SHA256 = '1654267c86a10b44fdbd9c0fe22faf9b94667cadd0952c67bdd688a7c8750ff6';
  // 一式の一番上に置かれる名前の一覧。scripts/build-kit.sh が現物から埋める。
  // 展開の前に、同じ名前のものが無いことを機械的に確かめるために使う（spec.md 第2節 A-8）。
  var KIT_TOP = '.agents AGENTS.md CLAUDE.md docs prompts scripts spec.md templates はじめに.txt';

  var wish = document.getElementById('wish');
  var err = document.getElementById('err');
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');
  var kicker = document.querySelector('.kicker');

  function buildMarkdown(text) {
    return [
      '# 初期ヒアリング — AIへの指示書',
      '',
      'このファイルは、非エンジニアの利用者が受け取ったものです。',
      'あなた（AI）はこれを読み、下の手順どおりに進めてください。',
      '',
      '## 作りたいもの',
      '',
      text,
      '',
      '## 手順',
      '',
      '### 0. 新しい空のフォルダを作り、その中で作業する',
      '',
      '**すでに何か入っているフォルダの中で始めてはいけません。**',
      'この一式は、案件1つにつきフォルダ1つで使います。既存のフォルダで始めると、',
      '同じ名前のファイルとぶつかり、そこで止まることになります。',
      '',
      '    mkdir shitaku-project && cd shitaku-project',
      '',
      'すでに何かが入っているフォルダで始めてしまった場合は、',
      '**利用者に「新しい空のフォルダを作ってやり直してよいか」を確認してください。**',
      '既存のファイルには触れないこと。',
      '',
      '### 1. 一式を取得する',
      '',
      '    curl -fsSL ' + KIT_URL + ' -o shitaku-kit.tar.gz',
      '',
      '### 2. 取得したものを照合する',
      '',
      '**中身をあなたが書いてはいけません。書き写してもいけません。**',
      '取ってきたものが正しいかどうかは、あなたの判断ではなく、ハッシュ値の一致で決めます。',
      '',
      '    macOS / Linux :  shasum -a 256 shitaku-kit.tar.gz',
      '    Windows       :  certutil -hashfile shitaku-kit.tar.gz SHA256',
      '',
      '正解の値:',
      '',
      '    ' + KIT_SHA256,
      '',
      '**一致しなければ、ファイルを1つも置かずに中止してください。**',
      'そのうえで「取得したものが壊れていたので中止しました」と利用者に伝えてください。',
      '「たぶん大丈夫」で先に進んではいけません。',
      '',
      '### 3. 展開する',
      '',
      '**`tar -xzf` を単体で実行してはいけません。**',
      'tar は同じ名前のものがあっても、何も言わずに上書きします。',
      '上書きしてよいかどうかを、あなたの注意力に任せません。下をそのまま実行してください。',
      '',
      '    CONFLICT=$(for f in ' + KIT_TOP + '; do [ -e "$f" ] && echo "  - $f"; done)',
      '    if [ -n "$CONFLICT" ]; then',
      '      echo "要対応"; echo',
      '      echo "同じ名前のものが既にあります。上書きしないため、展開していません。"',
      '      echo "$CONFLICT"',
      '    else',
      '      tar -xzf shitaku-kit.tar.gz && echo "問題なし"',
      '    fi',
      '',
      '**「要対応」が出たら、そこで止めて利用者に確認してください。**',
      '既存のものを消すことも変えることもしません。手順0に戻り、新しい空のフォルダでやり直します。',
      '',
      '### 4. 正しく置けたか確かめる（飛ばしてはいけません）',
      '',
      '**この手順を飛ばして次へ進んではいけません。** 一式が欠けたまま作業を始めると、',
      'ルールも検査も無いまま進むことになり、この仕組み全体が効かなくなります。',
      '',
      '一式を展開した場所へ移動してから実行します。別のフォルダに展開した場合は、',
      'まずそこへ移動してください。',
      '',
      '    cd <一式を展開したフォルダ>',
      '    bash scripts/verify-install.sh',
      '',
      '**出力の1行目をそのまま利用者に見せてください。**',
      '「問題なし」が出るまで、spec.md の記入にも実装にも進んではいけません。',
      '「要対応」なら、そこで止めて利用者に伝えてください。',
      '',
      '### 5. 進める前に、ここまでの結果を1行で伝える',
      '',
      '利用者に「一式は揃っています。ここから始めます」と伝えてから、次へ進んでください。',
      '',
      '## 以降の進め方',
      '',
      '**手順4が「問題なし」を出していない状態で、以降へ進んではいけません。**',
      '',
      '展開された AGENTS.md を読み、そこに書かれたルールに従ってください。',
      '上の「作りたいもの」は spec.md に転記され、そこがこの案件の芯になります。',
      ''
    ].join('\n');
  }


  function download(text) {
    var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'shitaku.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
    c.addEventListener('click', function () {
      wish.value = c.getAttribute('data-fill');
      err.classList.remove('on');
      wish.focus();
    });
  });

  document.getElementById('go').addEventListener('click', function () {
    var text = wish.value.trim();
    if (text === '') {                 // B-4: 空のまま配らない
      err.classList.add('on');
      wish.focus();
      return;
    }
    err.classList.remove('on');
    download(buildMarkdown(text));
    step1.setAttribute('data-state', 'done');
    step2.setAttribute('data-state', 'active');
    kicker.textContent = 'STEP 2 / 2';
    step2.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('again').addEventListener('click', function () {
    step2.setAttribute('data-state', 'waiting');
    step1.setAttribute('data-state', 'active');
    kicker.textContent = 'STEP 1 / 2';
    wish.value = '';
    step1.scrollIntoView({ behavior: 'smooth', block: 'start' });
    wish.focus();
  });

  document.getElementById('copy').addEventListener('click', function () {
    var t = document.getElementById('say').textContent;
    var btn = this;
    function done() {
      btn.textContent = 'コピーしました';
      setTimeout(function () { btn.textContent = 'コピー'; }, 1800);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(done, done);
      } else { done(); }
    } catch (e) { done(); }
  });
})();
</script>
</body>
</html>
